[project]
name = "duplexbench"
version = "0.1.0"
description = "Dograh Duplex Bench harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "soxr>=0.3",
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "httpx>=0.27",
  "websockets>=12",
  "psutil>=5.9",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "onnxruntime>=1.17",
  "whisper-normalizer>=1.0.0",
  "anthropic>=2.4.0",
]
[project.scripts]
duplexbench = "duplexbench.cli:app"
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/duplexbench"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
